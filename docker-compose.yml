version: '3.8'

services:
  zau-app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://zau_user:zau_pass@db:5432/zau_db
      - ZAU_ENV=production
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=zau_user
      - POSTGRES_PASSWORD=zau_pass
      - POSTGRES_DB=zau_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
