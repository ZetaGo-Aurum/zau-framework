[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my-zau-app"
version = "1.0.0"
description = "ZAU Fullstack Python Application"
requires-python = ">=3.11"
dependencies = [
    "zau-framework>=1.0.0",
    "uvicorn>=0.28.0",
    "starlette>=0.36.0",
    "sqlalchemy>=2.0.28",
    "aiosqlite>=0.20.0"
]
